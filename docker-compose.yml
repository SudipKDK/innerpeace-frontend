services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: innerpeace-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - innerpeace-frontend-net

networks:
  innerpeace-frontend-net:
    name: innerpeace_frontend_net
    driver: bridge
